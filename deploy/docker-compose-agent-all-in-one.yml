version: "3.8"

networks:
  kafka-net:
  rasp-net:
  security-net:

services:
  # Kafka 同时承载网络安全分析和智能体安全分析事件。
  kafka:
    image: essaigroup/deepxdr-kafka:v0.3.0
    container_name: kafka
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      - "29092:29092"
    networks:
      - kafka-net
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://<agent-host-ip>:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CLIENT_USERS: pmlqiangwang20251520
      KAFKA_CLIENT_PASSWORDS: PMLabs3edc2025
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
      KAFKA_CREATE_TOPICS: "agent:5:1,events:5:1,agent.session.finished:5:1,agent.rollback.requested:3:1,agent.rollback.completed:3:1,agent.session.dlq:3:1"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null && echo 'ok' || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  rasp-mongodb:
    image: mongo:4.4
    container_name: rasp-mongodb
    networks:
      rasp-net:
        aliases:
          - mongodb
    restart: unless-stopped

  rasp-elasticsearch:
    image: elasticsearch:6.8.23
    container_name: es
    ports:
      - "9201:9200"
    networks:
      rasp-net:
        aliases:
          - elasticsearch
    environment:
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rasp-cloud:
    image: essaigroup/deepxdr-rasp-cloud:v0.3.0-alpha
    container_name: rasp-cloud
    dns_search: .
    dns: 127.0.0.11
    networks:
      - rasp-net
      - kafka-net
    ports:
      - "8086:8086"
    depends_on:
      rasp-mongodb:
        condition: service_started
      rasp-elasticsearch:
        condition: service_healthy
    volumes:
      - ../third_party/openrasp/rasp-cloud-docker/conf/app.conf:/app/conf/app.conf
    restart: unless-stopped

  postgres:
    image: essaigroup/deepxdr-postgres:v0.3.0
    container_name: security-postgres
    ports:
      - "5432:5432"
    networks:
      - security-net
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: security_user
      POSTGRES_PASSWORD: security_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: security-redis
    networks:
      - security-net
      - kafka-net
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # AgentGuard diff 证据存储。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentguard-minio
    networks:
      - security-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: agentguard-minio-init
    networks:
      - security-net
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
       mc mb --ignore-existing local/agent-diffs"
    restart: "no"

  # 使用新版镜像，同时保留原网络基线参数并增加智能体事件路由。
  baseline-adjudication:
    image: essaigroup/deepxdr-baseline:v0.3.0-alpha
    container_name: baseline-adjudication
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SOURCE_TOPIC: events
      KAFKA_AGENT_TOPIC: agent
      KAFKA_AGENT_SESSION_TOPIC: agent.session.finished
      KAFKA_CONSUMER_GROUP_ID: anomaly-detector-group
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_SASL_MECHANISM: PLAIN
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      BASELINE_DURATION: 7200
      BASELINE_FILE_PATH: baseline.json
      DEBUG: "true"
      REDIS_VALUE_TYPE: key_fields
      CONTINUOUS_BASELINE_ENABLED: "false"
      BASELINE_SAVE_INTERVAL: 180
      ENABLE_FILEPATH_NUM_FUZZY_MATCH: "false"
      ENABLE_THREAD_NAME_FUZZY_MATCH: "true"
      FALCO_SKIP_FILE_TYPES: .tmp,.tmp.jpg,.dat,.so,.log,.log.gz
    restart: unless-stopped

  # 同一 ai-agent 进程同时运行原网络分析链路和 AgentGuard consumer。
  ai-agent:
    image: essaigroup/deepxdr-analysis:v0.3.0-alpha
    container_name: ai-agent
    user: root
    networks:
      - security-net
      - kafka-net
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${AGENTGUARD_WORKSPACE_ROOT:?AGENTGUARD_WORKSPACE_ROOT must be set}
        target: ${AGENTGUARD_WORKSPACE_ROOT:?AGENTGUARD_WORKSPACE_ROOT must be set}
      - type: bind
        source: ${AGENTGUARD_NONO_STATE_ROOT:?AGENTGUARD_NONO_STATE_ROOT must be set}
        target: ${AGENTGUARD_NONO_STATE_ROOT:?AGENTGUARD_NONO_STATE_ROOT must be set}
      - ${DEEPXDR_REAL_NONO:-/usr/local/bin/nono}:/usr/local/bin/nono:ro
      - /lib64:/lib64:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
    command: >
      sh -c "python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple 'boto3>=1.35.0,<2.0.0' &&
             python main.py"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      baseline-adjudication:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://security_user:security_pass@postgres:5432/security_db
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: agent
      KAFKA_GROUP_ID: security-analysis-group
      KAFKA_AGENT_SESSION_TOPIC: agent.session.finished
      KAFKA_AGENT_ROLLBACK_REQUESTED_TOPIC: agent.rollback.requested
      KAFKA_AGENT_ROLLBACK_COMPLETED_TOPIC: agent.rollback.completed
      AGENT_GUARD_ENABLED: "true"
      AGENTGUARD_PATHS_VALIDATED: ${AGENTGUARD_PATHS_VALIDATED:?Use scripts/agentguard-compose to validate host rollback paths}
      AGENT_GUARD_DIFF_STORAGE: minio
      AGENT_GUARD_DIFF_BUCKET: agent-diffs
      AGENT_GUARD_DIFF_PREFIX: smoke
      AGENT_GUARD_DIFF_ENDPOINT_URL: http://minio:9000
      AGENT_GUARD_DIFF_ACCESS_KEY_ID: minioadmin
      AGENT_GUARD_DIFF_SECRET_ACCESS_KEY: minioadmin
      AGENT_GUARD_MAX_DIFF_READ_BYTES: 8388608
      AGENT_GUARD_SMALL_DIFF_TOKEN_LIMIT: 200
      AGENT_GUARD_MEDIUM_DIFF_TOKEN_LIMIT: 800
      AGENT_GUARD_FILE_TOKEN_LIMIT: 300
      AGENT_GUARD_HUNK_TOKEN_LIMIT: 80
      LOG_LEVEL: DEBUG
      API_PORT: 8000

      ELASTICSEARCH_HOST: <app-host-ip>
      ELASTICSEARCH_PORT: 9201
      ELASTICSEARCH_MCP_URL: http://<app-host-ip>:8000/mcp
      FILESYSTEM_MCP_URL: ws://<app-host-ip>:8001/message
      GREP_MCP_URL: ws://<app-host-ip>:8003/message

      OPENAI_API_KEY: <your-llm-api-key>
      OPENAI_BASE_URL: <your-llm-api-base-url> 
      # [Required] Short TTP威胁分析及Long TTP主循环所使用的模型
      OPENAI_MODEL: <your-llm-model-name> 
      # [Required] Long TTP深度研究阶段使用的模型，建议使用较强模型
      RESEARCH_MODEL: <your-llm-model-name> 
      # [Required] 长上下文压缩/截断阶段使用的模型，建议选择成本较低且上下文能力稳定的模型
      COMPRESSION_MODEL: <your-llm-model-name> 
      # [Required] 摘要生成阶段使用的模型
      SUMMARIZATION_MODEL: <your-llm-model-name>
      # [Required] 最终报告生成阶段使用的模型，建议选择输出质量更高的模型
      FINAL_REPORT_MODEL: <your-llm-model-name> 
      # [Required] MITRE RAG 节点中的 LLM 判定模型。
      MITRE_RAG_LLM_MODEL: <your-llm-model-name> 
      USE_MITRE_INVESTIGATION_SUBGRAPH: "true"
      HUMAN_FEEDBACK_TIMEOUT_SECONDS: 1800
      MAX_HUMAN_FEEDBACK_ROUNDS: 4
      MAX_RESEARCHER_ITERATIONS: 3
      MAX_REACT_TOOL_CALLS: 9
      LONG_TTP_TRIGGER_SUPPRESSION_SECONDS: 5
      MCP_FILESYSTEM_ALLOWED_ROOT: /app/
      BACKEND_API_KEY: ${BACKEND_API_KEY:-DeepXDR}

      # [Optional]用于langsmith调试
      LANGSMITH_API_KEY: <your-langsmith-api-key>
      LANGSMITH_PROJECT: <your-langsmith-api-key>
      LANGSMITH_TRACING: <true or false>

      # [Required]DashScope embedding 的 OpenAI-compatible 接口地址，用于 MITRE RAG 向量化召回。
      DASHSCOPE_EMBEDDING_BASE_URL: <your-embedding-base-url>
      # [Required]DashScope embedding 模型名，需要和账号可用模型保持一致。
      DASHSCOPE_EMBEDDING_MODEL: <your-embedding-model-name>
      # [Required]DashScope rerank 接口地址，用于对 embedding 召回候选进行重排。
      DASHSCOPE_RERANK_BASE_URL: <your-rerank-base-url>
      # [Required]DashScope rerank 模型名，需要确认账号和地域支持该模型。
      DASHSCOPE_RERANK_MODEL: <your-rerank-model-name>
      # [Required]DashScope API Key 用于 MITRE RAG 的 embedding/rerank 路径
      DASHSCOPE_API_KEY: ${your-embedding-rerank-key}
      # [Optional]实验性功能，需配合部署ACL MCP
      MCP_SERVER_URL: <your-acl-mcp-url>
      GET_API_KEYS_FROM_CONFIG: "false"

    restart: unless-stopped

  web-ui:
    image: essaigroup/deepxdr-web-ui:v0.3.0-alpha
    container_name: web-ui
    networks:
      - security-net
    ports:
      - "30003:30003"
    depends_on:
      ai-agent:
        condition: service_started
    environment:
      API_BASE_URL: http://ai-agent:8000
      BACKEND_API_KEY: ${BACKEND_API_KEY:-DeepXDR}

    restart: unless-stopped

volumes:
  kafka-data:
  es-data:
  postgres-data:
  redis-data:
  minio-data:
