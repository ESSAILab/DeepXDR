[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepxdr-web-ui"
version = "1.0.0"
description = "DeepXDR TTP Analysis Dashboard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "websockets>=12.0",
]
